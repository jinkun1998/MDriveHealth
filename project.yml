name: MDriveHealth
options:
  bundleIdPrefix: com.maclife
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: vi

packages:
  MDriveHealthCore:
    path: Packages/MDriveHealthCore

targets:
  MDriveHealth:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MDriveHealthCore
        product: MDriveHealthCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MDriveHealth
        CFBundleDevelopmentRegion: vi
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Maclife community — GPL-3.0-or-later"
        LSMinimumSystemVersion: "14.0"
        # Deep link used by notification taps: mdrivehealth://drive/<id>
        CFBundleURLTypes:
          - CFBundleURLName: com.maclife.MDriveHealth
            CFBundleURLSchemes: [mdrivehealth]
        # First write to an external volume root during a benchmark may prompt.
        NSRemovableVolumesUsageDescription: "MDriveHealth ghi một file tạm thời để đo tốc độ đọc/ghi của ổ, rồi tự xoá."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maclife.MDriveHealth
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # SMART IOKit plug-ins are unavailable to sandboxed processes, so the
        # app ships outside the App Store without the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
